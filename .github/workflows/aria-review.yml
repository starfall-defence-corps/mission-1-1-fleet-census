name: ARIA Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  aria-review:
    name: ARIA — Mission 1.1 Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout mission repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run ARIA review
        id: aria
        uses: starfall-defence-corps/aria@v1.0.0
        with:
          mission: "1-1"
          mission-root: ${{ github.workspace }}
          output-file: aria-output.txt
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          skip-tests: "true"

      - name: Post ARIA review as PR comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          ARIA_ICON: ${{ steps.aria.outputs.icon }}
          ARIA_HEADLINE: ${{ steps.aria.outputs.headline }}
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('aria-output.txt', 'utf8');
            } catch {
              output = fs.readFileSync('aria-console.txt', 'utf8');
            }
            // ARIA decides the headline (review posted / skipped: no API key /
            // failed: API error); this step only renders it. CI never grades
            // the mission — the cadet's local `make test` does.
            const status = process.env.ARIA_HEADLINE || 'REVIEW FAILED — ARIA did not run';
            const icon = process.env.ARIA_ICON || ':warning:';
            const marker = 'ARIA — Mission 1-1 Review';

            // Render the qualitative review as markdown in the comment body;
            // only the console portion stays inside the code fence (#127).
            const splitAt = output.indexOf('## ARIA QUALITATIVE REVIEW');
            const consoleOut = splitAt === -1 ? output : output.slice(0, splitAt).trimEnd();
            const reviewMd = splitAt === -1 ? '' : output.slice(splitAt);

            const body = `## ${icon} ${marker} (${status})

            ${reviewMd}

            <details>
            <summary>Console output</summary>

            \`\`\`
            ${consoleOut}
            \`\`\`

            </details>

            ---
            *ARIA — Automated Review & Intelligence Analyst*
            *Starfall Defence Corps Academy*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const ariaComment = comments.find(c => c.body.includes(marker));

            if (ariaComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: ariaComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
